<!doctype html>
<html lang="en">

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>ASCII Cloud Rain</title>
    <script>
      // Apply the saved theme (else the system one) before first paint, so dark mode never flashes light.
      try {
        const saved = localStorage.getItem('theme')
        document.documentElement.dataset.theme =
          saved === 'dark' || saved === 'light' ? saved : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      } catch {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
