<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cloud Rain</title>
<style>
  html, body { margin: 0; background: #04083a; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
</style>
<canvas id="c" role="img" aria-label="A cloudscape drawn with numbers, with numbers falling over it like rain"></canvas>
<script type="module">
// The hosted page: the renderer lives in cloud-rain.js. Settings come from the query string
// (?effect=evening&cell=8) and, when embedded by the editor, from same-origin postMessage.
import { mount } from './cloud-rain.js';
const shader = mount(document.getElementById('c'), Object.fromEntries(new URLSearchParams(location.search)));
addEventListener('message', e => { if (e.origin === location.origin) shader.update(e.data); });
// The editor's preset swatches are stills rendered here, so they always match the real look.
shader.ready.then(() => { if (parent !== window) parent.postMessage({ type: 'thumbs', thumbs: shader.thumbs() }, location.origin); });
</script>
</html>
